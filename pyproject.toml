[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "warframe-archives"
dynamic = ["version"]
description = "Cephalon Archive — pipeline de collecte du lore Warframe (scraping MediaWiki, nettoyage Markdown, canon, chunking RAG, PostgreSQL/pgvector)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "requests>=2.31.0",
    "mwparserfromhell>=0.6.5",
    "aiohttp>=3.9",
    "SQLAlchemy>=2.0",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pydantic>=2.7",
    "tenacity>=8.2",
    "playwright>=1.44",
]

[project.scripts]
cephalon = "warframe_lore.cli:main"
cephalon-ui = "warframe_lore.ui.server:main"
loremaster = "warframe_lore.discord.main:main"

[project.optional-dependencies]
discord = ["discord.py>=2.0"]
test = ["pytest>=8.0"]
dev = ["ruff>=0.4", "mypy>=1.10"]

[tool.setuptools.dynamic]
version = { attr = "warframe_lore.__version__" }

[tool.setuptools.packages.find]
include = ["warframe_lore*"]

[tool.setuptools.package-data]
warframe_lore = ["**/*.md", "**/*.json", "**/*.html", "**/*.css", "**/*.js", "**/*.vue"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
python_functions = ["test_*"]

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = ["warframe_lore/ui/inspector", "warframe_lore/ui/timeline", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["UP007"]